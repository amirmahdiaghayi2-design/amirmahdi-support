<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:tahoma;
}

body{
background:#0f172a;
color:white;
line-height:1.8;
}

header{
padding:80px 20px;
text-align:center;
background:linear-gradient(135deg,#2563eb,#7c3aed);
}

header h1{
font-size:38px;
margin-bottom:15px;
}

header p{
font-size:18px;
}

section{
padding:60px 20px;
max-width:1000px;
margin:auto;
}

.card{
background:#1e293b;
padding:25px;
border-radius:20px;
margin:20px 0;
box-shadow:0 0 20px rgba(255,255,255,.08);
}

h2{
margin-bottom:20px;
color:#60a5fa;
}

.gallery{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:20px;
}

.gallery img{
width:100%;
border-radius:20px;
height:250px;
object-fit:cover;
}

input,textarea{
width:100%;
padding:15px;
margin:10px 0;
border:none;
border-radius:12px;
font-size:16px;
}

button{
background:#2563eb;
color:white;
border:none;
padding:15px 25px;
border-radius:12px;
font-size:18px;
cursor:pointer;
}

button:hover{
background:#1d4ed8;
}

footer{
text-align:center;
padding:40px;
background:#111827;
margin-top:40px;
}

.counter{
font-size:40px;
font-weight:bold;
color:#60a5fa;
text-align:center;
}
</style>

از حمایت و نظرات شما ممنونیم.
</p>
</header>

<section>

<div class="card">

<p>

</p>
